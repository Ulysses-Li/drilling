<!doctype html>
<html lang="zh-Hant">

<head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>鑽孔刀具篩選器</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
      <style>
            body {
                  background: #f4f7fb;
                  color: #1f2937;
                  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", Arial, sans-serif;
            }

            .app-card {
                  max-width: 980px;
                  margin: 40px auto;
                  border: 0;
                  border-radius: 24px;
                  box-shadow: 0 16px 40px rgba(15, 23, 42, .10);
                  overflow: hidden;
            }

            .hero {
                  background: linear-gradient(135deg, #0f172a, #2563eb);
                  color: #fff;
                  padding: 28px;
            }

            .hero p {
                  color: rgba(255, 255, 255, .78);
                  margin-bottom: 0;
            }

            .mode-btn {
                  border-radius: 16px;
                  padding: 18px;
                  text-align: left;
                  border: 2px solid #e5e7eb;
                  background: #fff;
                  transition: .18s;
            }

            .mode-btn:hover {
                  transform: translateY(-1px);
                  border-color: #93c5fd;
            }

            .mode-btn.active {
                  border-color: #2563eb;
                  background: #eff6ff;
                  box-shadow: 0 8px 22px rgba(37, 99, 235, .16);
            }

            .mode-title {
                  font-size: 1.12rem;
                  font-weight: 800;
            }

            .mode-desc {
                  font-size: .92rem;
                  color: #64748b;
                  margin-top: 4px;
            }

            .result-card {
                  border-radius: 18px;
                  border: 1px solid #dbeafe;
                  background: #f8fbff;
            }

            .badge-soft {
                  background: #e0f2fe;
                  color: #075985;
                  border: 1px solid #bae6fd;
            }

            .table thead th {
                  background: #f1f5f9;
                  color: #334155;
            }

            .small-note {
                  font-size: .9rem;
                  color: #64748b;
            }

            .empty-state {
                  border: 1px dashed #cbd5e1;
                  border-radius: 18px;
                  padding: 24px;
                  text-align: center;
                  color: #64748b;
                  background: #fff;
            }
      </style>
</head>

<body>
      <main class="container px-3">
            <section class="card app-card">
                  <div class="hero">
                        <h1 class="h3 fw-bold mb-2">鑽孔刀具快選</h1>
                        <p>輸入要鑽的孔徑，選擇加工深度模式，系統會自動推薦「D 等於輸入值」或「小於輸入值的最大 D」。</p>
                  </div>

                  <div class="card-body p-4 p-md-5">
                        <div class="row g-3 mb-4">
                              <div class="col-md-6">
                                    <button class="mode-btn w-100 active" type="button" data-product="Super Drill"
                                          data-mode="short">
                                          <div class="mode-title">&le; 4xD</div>
                                          <div class="mode-desc">調用 Super Drill 資料</div>
                                    </button>
                              </div>
                              <div class="col-md-6">
                                    <button class="mode-btn w-100" type="button" data-product="Super Power Drill"
                                          data-mode="long">
                                          <div class="mode-title">&gt; 4xD</div>
                                          <div class="mode-desc">調用 Super Power Drill 資料</div>
                                    </button>
                              </div>
                        </div>

                        <div class="row g-3 align-items-end mb-4">
                              <div class="col-md-8">
                                    <label class="form-label fw-semibold" for="holeSize">我要鑽多大的孔？</label>
                                    <div class="input-group input-group-lg">
                                          <span class="input-group-text">Ø</span>
                                          <input id="holeSize" class="form-control" type="number" min="0" step="0.1"
                                                placeholder="例如：18.7">
                                          <span class="input-group-text">mm</span>
                                    </div>
                                    <div class="form-text">例：輸入 18.7，會抓 D &le; 18.7 中最大的刀具。</div>
                              </div>
                              <div class="col-md-4 d-grid">
                                    <button id="searchBtn" class="btn btn-primary btn-lg" type="button">篩選刀具</button>
                              </div>
                        </div>

                        <div id="status" class="alert alert-info d-none" role="alert"></div>

                        <section id="bestResult" class="result-card p-4 mb-4 d-none">
                              <div class="d-flex flex-wrap justify-content-between gap-2 align-items-start mb-3">
                                    <div>
                                          <div class="small-note">推薦結果</div>
                                          <h2 id="bestTitle" class="h4 fw-bold mb-0"></h2>
                                    </div>
                                    <span id="bestMode" class="badge badge-soft rounded-pill px-3 py-2"></span>
                              </div>
                              <div class="row g-3">
                                    <div class="col-sm-3">
                                          <div class="small-note">產品</div>
                                          <div id="bestProduct" class="fw-bold"></div>
                                    </div>
                                    <div class="col-sm-3">
                                          <div class="small-note">Parts No.</div>
                                          <div id="bestPart" class="fw-bold"></div>
                                    </div>
                                    <div class="col-sm-3">
                                          <div class="small-note">D</div>
                                          <div id="bestD" class="fw-bold"></div>
                                    </div>
                                    <div class="col-sm-3">
                                          <div class="small-note">T</div>
                                          <div id="bestT" class="fw-bold"></div>
                                    </div>
                                    <div class="col-sm-3">
                                          <div class="small-note">L</div>
                                          <div id="bestL" class="fw-bold"></div>
                                    </div>
                                    <div class="col-sm-3">
                                          <div class="small-note">ØD</div>
                                          <div id="bestd" class="fw-bold"></div>
                                    </div>

                              </div>
                        </section>

                        <div id="emptyState" class="empty-state">請先輸入孔徑，並選擇 &le; 4xD 或 &gt; 4xD。</div>

                        <div id="tableWrap" class="table-responsive d-none">
                              <div class="d-flex justify-content-between align-items-center mb-2">
                                    <h3 class="h6 fw-bold mb-0">符合條件清單</h3>
                                    <span id="countText" class="small-note"></span>
                              </div>
                              <table class="table table-hover align-middle">
                                    <thead>
                                          <tr>
                                                <th>Product</th>
                                                <th>Parts No.</th>
                                                <th>Cutter Diameter ( ∅D) ±0.2mm</th>
                                                <th>Drilling Depth (T)</th>
                                                <th>Functional Length (L1)</th>
                                                <th>Shank Size (Ød)</th>
                                          </tr>
                                    </thead>
                                    <tbody id="resultBody"></tbody>
                              </table>
                        </div>
                  </div>
            </section>
      </main>

            ];

            const modeButtons = document.querySelectorAll('.mode-btn');
            const holeSizeInput = document.querySelector('#holeSize');
            const searchBtn = document.querySelector('#searchBtn');
            const statusBox = document.querySelector('#status');
            const bestResult = document.querySelector('#bestResult');
            const bestTitle = document.querySelector('#bestTitle');
            const bestMode = document.querySelector('#bestMode');
            const bestProduct = document.querySelector('#bestProduct');
            const bestPart = document.querySelector('#bestPart');
            const bestD = document.querySelector('#bestD');
            const bestT = document.querySelector('#bestT');

            const bestL = document.querySelector('#bestL');
            const bestd = document.querySelector('#bestd');

            const emptyState = document.querySelector('#emptyState');
            const tableWrap = document.querySelector('#tableWrap');
            const resultBody = document.querySelector('#resultBody');
            const countText = document.querySelector('#countText');

            let selectedProduct = 'Super Drill';
            let selectedModeText = '<= 4xD';

            modeButtons.forEach((button) => {
                  button.addEventListener('click', () => {
                        modeButtons.forEach((item) => item.classList.remove('active'));
                        button.classList.add('active');
                        selectedProduct = button.dataset.product;
                        selectedModeText = button.dataset.mode === 'short' ? '<= 4xD' : '> 4xD';
                        runSearch();
                  });
            });

            searchBtn.addEventListener('click', runSearch);
            holeSizeInput.addEventListener('keydown', (event) => {
                  if (event.key === 'Enter') runSearch();
            });
            holeSizeInput.addEventListener('input', () => {
                  if (holeSizeInput.value !== '') runSearch();
            });

            function runSearch() {
                  const holeSize = Number(holeSizeInput.value);
                  hideStatus();

                  if (!holeSizeInput.value || Number.isNaN(holeSize) || holeSize <= 0) {
                        resetView();
                        showStatus('請輸入大於 0 的孔徑數字。', 'warning');
                        return;
                  }

                  const sameProductItems = drillData
                        .filter((item) => item.productName === selectedProduct)
                        .sort((a, b) => a.D - b.D || a.T - b.T);

                  const matchedItems = sameProductItems.filter((item) => item.D <= holeSize);

                  if (matchedItems.length === 0) {
                        resetView();
                        showStatus(`${selectedModeText} / ${selectedProduct} 找不到 D 小於或等於 ${formatNumber(holeSize)} mm 的刀具。`, 'danger');
                        return;
                  }

                  const maxD = Math.max(...matchedItems.map((item) => item.D));
                  const bestItems = matchedItems.filter((item) => item.D === maxD).sort((a, b) => a.T - b.T);
                  const bestItem = bestItems[0];

                  bestTitle.textContent = `${bestItem.partNo}`;
                  bestMode.textContent = `${selectedModeText}｜${selectedProduct}`;
                  bestProduct.textContent = bestItem.productName;
                  bestPart.textContent = bestItem.partNo;
                  bestD.textContent = `Ø${formatNumber(bestItem.D)} mm`;
                  bestT.textContent = `${formatNumber(bestItem.T)} mm`;
                  bestL.textContent = `${formatNumber(bestItem.L)} mm`;
                  bestd.textContent = `${formatNumber(bestItem.d)} mm`;

                  // resultBody.innerHTML = bestItems.map((item) => `
                  //   <tr>
                  //     <td>${escapeHtml(item.productName)}</td>
                  //     <td class="fw-semibold">${escapeHtml(item.partNo)}</td>
                  //     <td>Ø${formatNumber(item.D)} mm</td>
                  //     <td>${formatNumber(item.T)} mm</td>
                  //   </tr>
                  // `).join('');

                  resultBody.innerHTML = bestItems.map((item) => `
                    <tr>
                      <td>${escapeHtml(item.productName)}</td>
                      <td class="fw-semibold">${escapeHtml(item.partNo)}</td>
                      <td>Ø${formatNumber(item.D)} mm</td>
                      <td>${formatNumber(item.T)} mm</td>
                      <td>${formatNumber(item.L)} mm</td>
                      <td>${formatNumber(item.d)} mm</td>
                    </tr>
                  `).join('');


                  countText.textContent = `共 ${bestItems.length} 筆，D = ${formatNumber(maxD)} mm`;
                  bestResult.classList.remove('d-none');
                  tableWrap.classList.remove('d-none');
                  emptyState.classList.add('d-none');

                  if (maxD < holeSize) {
                        showStatus(`沒有剛好 Ø${formatNumber(holeSize)} 的資料，已改推薦小於孔徑的最大 D：Ø${formatNumber(maxD)}。`, 'info');
                  }
            }

            function resetView() {
                  bestResult.classList.add('d-none');
                  tableWrap.classList.add('d-none');
                  emptyState.classList.remove('d-none');
                  resultBody.innerHTML = '';
                  countText.textContent = '';
            }

            function showStatus(message, type) {
                  statusBox.textContent = message;
                  statusBox.className = `alert alert-${type}`;
            }

            function hideStatus() {
                  statusBox.className = 'alert alert-info d-none';
                  statusBox.textContent = '';
            }

            function formatNumber(value) {
                  return Number(value).toLocaleString('zh-TW', { maximumFractionDigits: 3 });
            }

            function escapeHtml(value) {
                  return String(value)
                        .replaceAll('&', '&amp;')
                        .replaceAll('<', '&lt;')
                        .replaceAll('>', '&gt;')
                        .replaceAll('"', '&quot;')
                        .replaceAll("'", '&#039;');
            }
