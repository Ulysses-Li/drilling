<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鑽孔刀具篩選器</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f6f8fb; }
    .app-card { max-width: 980px; margin: 40px auto; }
    .result-card { border-left: 6px solid #0d6efd; }
    .muted-small { font-size: .9rem; color: #6c757d; }
    .table thead th { white-space: nowrap; }
    .badge-soft { background: #e9f2ff; color: #0d6efd; }
  </style>
</head>
<body>
  <main class="container app-card">
    <section class="card shadow-sm border-0 rounded-4">
      <div class="card-body p-4 p-md-5">
        <div class="d-flex flex-column flex-md-row justify-content-between gap-3 mb-4">
          <div>
            <h1 class="h3 fw-bold mb-2">鑽孔刀具篩選器</h1>
            <p class="text-secondary mb-0">輸入你要鑽的孔徑，系統會找出 <strong>D 等於輸入值</strong> 或 <strong>D 小於輸入值的最大刀徑</strong>。</p>
          </div>
          <div class="text-md-end">
            <span class="badge badge-soft rounded-pill px-3 py-2">Super Drill / Super Power Drill</span>
          </div>
        </div>

        <div class="row g-3 align-items-end mb-4">
          <div class="col-md-5">
            <label for="holeSize" class="form-label fw-semibold">我要鑽多大的孔？</label>
            <div class="input-group input-group-lg">
              <input id="holeSize" type="number" step="0.1" min="0" class="form-control" placeholder="例如：18.2">
              <span class="input-group-text">mm</span>
            </div>
            <div class="muted-small mt-2">邏輯：先找 D ≤ 輸入孔徑，再取最大的 D。</div>
          </div>
          <div class="col-md-auto">
            <button id="searchBtn" class="btn btn-primary btn-lg px-4">篩選</button>
          </div>
          <div class="col-md-auto">
            <button id="clearBtn" class="btn btn-outline-secondary btn-lg px-4">清除</button>
          </div>
        </div>

        <div id="alertBox" class="alert alert-warning d-none" role="alert"></div>

        <section id="bestResult" class="card result-card shadow-sm rounded-4 mb-4 d-none">
          <div class="card-body">
            <div class="d-flex flex-column flex-md-row justify-content-between gap-2">
              <div>
                <div class="text-secondary small mb-1">建議選擇</div>
                <h2 id="bestTitle" class="h4 fw-bold mb-1"></h2>
                <div id="bestInfo" class="text-secondary"></div>
              </div>
              <div class="text-md-end">
                <div class="small text-secondary">符合刀徑</div>
                <div id="bestD" class="display-6 fw-bold text-primary mb-0"></div>
              </div>
            </div>
          </div>
        </section>

        <div class="d-flex justify-content-between align-items-center mb-2">
          <h3 class="h5 fw-bold mb-0">同刀徑可選清單</h3>
          <span id="countText" class="text-secondary small"></span>
        </div>

        <div class="table-responsive bg-white rounded-4 border">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>產品名稱</th>
                <th>料號</th>
                <th class="text-end">D 刀徑 / mm</th>
                <th class="text-end">T 深度 / mm</th>
              </tr>
            </thead>
            <tbody id="resultBody">
              <tr>
                <td colspan="4" class="text-center text-secondary py-4">請輸入孔徑後按「篩選」。</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

    const countText = document.getElementById('countText');

    function formatNumber(value) {
      return Number(value).toLocaleString('zh-TW', { maximumFractionDigits: 3 });
    }

    function showAlert(message) {
      alertBox.textContent = message;
      alertBox.classList.remove('d-none');
    }

    function hideAlert() {
      alertBox.classList.add('d-none');
      alertBox.textContent = '';
    }

    function renderEmpty(message) {
      bestResult.classList.add('d-none');
      countText.textContent = '';
      resultBody.innerHTML = `<tr><td colspan="4" class="text-center text-secondary py-4">${message}</td></tr>`;
    }

    function searchDrill() {
      hideAlert();

      const holeSize = Number(holeSizeInput.value);
      if (!holeSizeInput.value || Number.isNaN(holeSize) || holeSize <= 0) {
        showAlert('請先填寫正確的孔徑數字。');
        renderEmpty('請輸入孔徑後按「篩選」。');
        return;
      }

      const available = drillData
        .filter(item => Number(item.D) <= holeSize)
        .sort((a, b) => Number(b.D) - Number(a.D) || Number(a.T) - Number(b.T));

      if (available.length === 0) {
        showAlert(`目前資料沒有 D ≤ ${formatNumber(holeSize)} mm 的刀具。`);
        renderEmpty('沒有符合條件的刀具。');
        return;
      }

      const selectedD = Number(available[0].D);
      const sameDiameterItems = drillData
        .filter(item => Number(item.D) === selectedD)
        .sort((a, b) => Number(a.T) - Number(b.T));

      const first = sameDiameterItems[0];
      bestTitle.textContent = `${first.productName}｜${first.partNo}`;
      bestInfo.textContent = `輸入孔徑：${formatNumber(holeSize)} mm，篩選到最接近且不大於孔徑的刀徑。`;
      bestD.textContent = `D ${formatNumber(selectedD)}`;
      bestResult.classList.remove('d-none');

      countText.textContent = `共 ${sameDiameterItems.length} 筆，D = ${formatNumber(selectedD)} mm`;
      resultBody.innerHTML = sameDiameterItems.map(item => `
        <tr>
          <td>${item.productName}</td>
          <td><code>${item.partNo}</code></td>
          <td class="text-end fw-semibold">${formatNumber(item.D)}</td>
          <td class="text-end">${formatNumber(item.T)}</td>
        </tr>
      `).join('');
    }

    function clearSearch() {
      holeSizeInput.value = '';
      hideAlert();
      renderEmpty('請輸入孔徑後按「篩選」。');
      holeSizeInput.focus();
    }

    searchBtn.addEventListener('click', searchDrill);
    clearBtn.addEventListener('click', clearSearch);
    holeSizeInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') searchDrill();
    });
  </script>
</body>
</html>
